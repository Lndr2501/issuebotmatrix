[project]
name = "issuebotmatrix"
version = "0.2.0"
description = "Matrix-Issue-Bot: !issue Titel | Beschreibung legt ein GitHub-Issue an (mit Diddy-Karten)"
requires-python = ">=3.11"
dependencies = [
    # Bot-Library (Matrix, E2EE, Diddy-Karten). Nach dem Merge von Diddy-PR #230 auf @main stellen.
    "diddy-bot @ git+https://github.com/Lndr2501/diddy.git@feat/bot-sdk#subdirectory=sdk/python",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["issuebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
